[package]
name = "tauri-plugin-ios-native"
version = "0.1.0"
edition = "2021"
description = "iOS-only helper Rust cannot do itself: preview a file in the system viewer (Quick Look)"
links = "tauri-plugin-ios-native"

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
